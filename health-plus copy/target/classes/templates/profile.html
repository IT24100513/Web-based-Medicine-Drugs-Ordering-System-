<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>My Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
          theme: {
            extend: {
              colors: {
                brand: {50:'#eef6ff',100:'#d9eaff',200:'#bcd9ff',300:'#8fbaf2',400:'#5d95d6',500:'#1C5D99',600:'#164a79',700:'#123d66',800:'#0f3152',900:'#0b2540'},
                mint:  {50:'#f0fdfa',100:'#ccfbf1',200:'#99f6e4',300:'#5eead4',400:'#2dd4bf',500:'#14b8a6',600:'#0d9488',700:'#0f766e',800:'#115e59',900:'#134e4a'}
              }
            }
          }
        }
    </script>
    <style>html,body{font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;}</style>
</head>
<body class="bg-white">
<div class="max-w-3xl mx-auto px-4 py-8">
    <!-- Back -->
    <a href="/" class="inline-flex items-center gap-2 text-brand-600 hover:text-brand-700 transition">
        <span aria-hidden="true">←</span> Back
    </a>

    <div class="bg-white rounded-2xl shadow-md border border-mint-200 mt-4 overflow-hidden">
        <!-- Accent -->
        <div class="h-1.5 bg-gradient-to-r from-brand-500 via-mint-400 to-brand-500"></div>

        <!-- Header -->
        <div class="p-6 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
            <div>
                <h1 class="text-2xl font-bold text-brand-900">Account Details</h1>
                <p class="text-mint-700 mt-1" th:text="${appUser.email}">you@example.com</p>
            </div>

            <div class="flex items-center gap-3">
                <!-- Edit details (URL unchanged) -->
                <a href="/edit-profile"
                   class="inline-flex items-center justify-center rounded-lg border border-brand-300 px-4 py-2 text-sm font-medium text-brand-700 hover:bg-brand-50 focus:outline-none focus:ring-2 focus:ring-mint-500 focus:ring-offset-2 transition">
                    Edit details
                </a>

                <!-- Delete (opens modal) -->
                <button type="button" id="openDeleteModal"
                        class="inline-flex items-center justify-center rounded-lg bg-red-600 px-4 py-2 text-sm font-medium text-white hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-400 focus:ring-offset-2 transition">
                    Delete account
                </button>
            </div>
        </div>

        <!-- Profile summary -->
        <div class="px-6 pb-6">
            <div class="flex items-center gap-4 mb-6">
                <div class="w-14 h-14 rounded-xl bg-mint-100 text-brand-700 grid place-items-center text-xl font-bold ring-2 ring-mint-300">
                    <span th:text="${#strings.toUpperCase(#strings.substring(appUser.firstName,0,1))} + ${#strings.toUpperCase(#strings.substring(appUser.lastName,0,1))}">AB</span>
                </div>
                <div>
                    <div class="text-lg font-semibold text-brand-900"
                         th:text="${appUser.firstName} + ' ' + ${appUser.lastName}">Alex Brown</div>
                    <!-- User ID removed per your earlier request -->
                </div>
            </div>

            <!-- Details -->
            <dl class="divide-y divide-mint-200">
                <div class="py-3 grid grid-cols-3 gap-4">
                    <dt class="text-mint-700">Full Name</dt>
                    <dd class="col-span-2 text-brand-900" th:text="${appUser.firstName} + ' ' + ${appUser.lastName}">Alex Brown</dd>
                </div>
                <div class="py-3 grid grid-cols-3 gap-4">
                    <dt class="text-mint-700">Email</dt>
                    <dd class="col-span-2 text-brand-900" th:text="${appUser.email}">you@example.com</dd>
                </div>
                <div class="py-3 grid grid-cols-3 gap-4">
                    <dt class="text-mint-700">Phone</dt>
                    <dd class="col-span-2 text-brand-900" th:text="${appUser.phone}">0771234567</dd>
                </div>
                <div class="py-3 grid grid-cols-3 gap-4">
                    <dt class="text-mint-700">Address</dt>
                    <dd class="col-span-2 text-brand-900" th:text="${appUser.address}">123 Wellness Ave</dd>
                </div>
            </dl>
        </div>
    </div>
</div>

<!-- Delete Account Modal -->
<dialog id="deleteDialog" class="rounded-2xl backdrop:bg-black/40 p-0 w-[90%] max-w-md">
    <form method="dialog" id="closeDeleteForm"></form>
    <div class="p-6">
        <div class="flex items-start gap-3">
            <div class="shrink-0 mt-0.5 rounded-lg bg-red-100 p-2 text-red-600">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.721-1.36 3.486 0l6.518 11.59c.75 1.334-.213 2.986-1.743 2.986H3.482c-1.53 0-2.493-1.652-1.743-2.985l6.518-11.591zM9 7a1 1 0 112 0v4a1 1 0 11-2 0V7zm1 8a1.25 1.25 0 100-2.5A1.25 1.25 0 0010 15z" clip-rule="evenodd"/>
                </svg>
            </div>
            <div>
                <h2 class="text-lg font-semibold text-red-700">Delete account?</h2>
                <p class="mt-2 text-sm text-red-600">
                    This action is permanent and will remove your account and related data.
                </p>
            </div>
        </div>

        <div class="mt-6 flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
            <button form="closeDeleteForm"
                    class="inline-flex items-center justify-center rounded-lg border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-300 focus:ring-offset-2 transition">
                Cancel
            </button>

            <!-- Confirm delete: hits GET /profile/delete/{id} -->
            <a th:href="@{/profile/delete}"
               class="inline-flex items-center justify-center rounded-lg bg-red-600 px-4 py-2 text-sm font-medium text-white hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-400 focus:ring-offset-2 transition"
               onclick="return confirm('Are you sure you want to permanently delete this account?');">
                Yes, delete permanently
            </a>
        </div>
    </div>
</dialog>

<script>
    (function () {
      const openBtn = document.getElementById('openDeleteModal');
      const dialog = document.getElementById('deleteDialog');

      if (openBtn && dialog) {
        openBtn.addEventListener('click', () => dialog.showModal());
        dialog.addEventListener('click', (e) => {
          const rect = dialog.getBoundingClientRect();
          const inside = e.clientX >= rect.left && e.clientX <= rect.right &&
                         e.clientY >= rect.top  && e.clientY <= rect.bottom;
          if (!inside) dialog.close();
        });
      }
    })();
</script>
</body>
</html>
