<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediStock Pro - Redirecting</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .loader { border-top-color: #4f46e5; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center">

<div class="text-center fade-in p-8 bg-white rounded-2xl shadow-xl max-w-md">
    <div class="flex justify-center mb-6">
        <div class="w-20 h-20 rounded-full border-4 border-gray-200 loader"></div>
    </div>
    <h1 class="text-2xl font-bold text-gray-900 mb-2">Redirecting to Medicines...</h1>
    <p class="text-gray-600 mb-4">Your inventory dashboard will load shortly.</p>
    <div class="flex justify-center space-x-2">
        <a href="/medicines" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition-colors">Go Now</a>
        <button onclick="startRedirect()" class="px-4 py-2 bg-green-500 hover:bg-green-600 text-white rounded-lg font-medium transition-colors">Auto Redirect</button>
    </div>
</div>

<script>
    function startRedirect() {
        const loader = document.querySelector('.loader');
        loader.classList.add('border-t-4', 'border-blue-500');
        setTimeout(() => {
            window.location.href = '/medicines';
        }, 2000); // 2-second delay
    }

    // Optional: auto redirect after 3 seconds
    setTimeout(() => {
        window.location.href = '/medicines';
    }, 3000);
</script>
</body>
</html>
