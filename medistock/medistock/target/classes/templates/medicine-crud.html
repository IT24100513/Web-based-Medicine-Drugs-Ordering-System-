<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lovely Meds - Inventory</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ffe6f0, #fff0f5);
            color: #333;
        }
        .header {
            background-color: #ffb6c1;
            color: white;
            padding: 25px 0;
            text-align: center;
            border-radius: 0 0 20px 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        .card-custom {
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }
        .btn-custom {
            border-radius: 50px;
            transition: transform 0.2s;
        }
        .btn-custom:hover {
            transform: scale(1.05);
        }
        table th, table td {
            vertical-align: middle !important;
        }
        .table-hover tbody tr:hover {
            background-color: #ffe6f7;
        }
    </style>
</head>
<body>

<div class="header">
    <h1><i class="bi bi-heart-fill"></i> Lovely Meds Inventory</h1>
    <p class="lead">Manage your medicines with style 💖</p>
</div>

<div class="container">
    <!-- Add Medicine Form -->
    <div class="card card-custom mb-5 p-4">
        <h4 class="mb-3 text-pink-600">💊 Add New Medicine</h4>
        <form th:action="@{/medicines/add}" method="post">
            <div class="row g-3">
                <div class="col-md-4">
                    <input type="text" class="form-control form-control-lg" placeholder="Medicine Name" name="name" required>
                </div>
                <div class="col-md-2">
                    <input type="number" class="form-control form-control-lg" placeholder="Quantity" name="quantity" required>
                </div>
                <div class="col-md-2">
                    <input type="number" class="form-control form-control-lg" placeholder="Unit Price" name="price" step="0.01" required>
                </div>
                <div class="col-md-2">
                    <select class="form-select form-select-lg" name="category" required>
                        <option selected disabled>Category</option>
                        <option value="Antibiotics">Antibiotics</option>
                        <option value="Pain Relief">Pain Relief</option>
                        <option value="Vitamins">Vitamins</option>
                        <option value="Cardiac">Cardiac</option>
                    </select>
                </div>
                <div class="col-md-2 d-grid">
                    <button type="submit" class="btn btn-pink btn-custom btn-lg text-white" style="background-color: #ff69b4;">
                        <i class="bi bi-plus-lg"></i> Add
                    </button>
                </div>
            </div>
        </form>
    </div>

    <!-- Medicine List -->
    <div class="card card-custom p-4">
        <h4 class="mb-3 text-pink-600">📋 Current Inventory</h4>
        <table class="table table-hover">
            <thead class="table-light">
            <tr>
                <th>#</th>
                <th>Name</th>
                <th>Quantity</th>
                <th>Price</th>
                <th>Category</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="med, iterStat : ${medicines}">
                <td th:text="${iterStat.count}"></td>
                <td th:text="${med.name}"></td>
                <td th:text="${med.quantity}"></td>
                <td th:text="${med.price}"></td>
                <td th:text="${med.category}"></td>
                <td>
                    <a th:href="@{/medicines/edit/{id}(id=${med.id})}" class="btn btn-primary btn-sm btn-custom"><i class="bi bi-pencil"></i></a>
                    <a th:href="@{/medicines/delete/{id}(id=${med.id})}" class="btn btn-danger btn-sm btn-custom"><i class="bi bi-trash"></i></a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
