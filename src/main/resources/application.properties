spring.application.name=OrderManagementSystem

#Database connection
spring.datasource.url=jdbc:mysql://localhost:3306/ordermanagementsystem?useSSL=false&serverTimezone=UTC&useLegacyDatetimeCode=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=qwertyuiop123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Change from create-drop to update to preserve data
spring.jpa.hibernate.ddl-auto=update
# Or use validate to check schema matches entity
# spring.jpa.hibernate.ddl-auto=validate

# Thymeleaf configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

# Show SQL queries in logs
logging.level.org.hibernate.sql=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# File upload settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB