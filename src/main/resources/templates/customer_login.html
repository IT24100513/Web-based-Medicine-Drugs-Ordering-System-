<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Customer Login - Order Management System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .login-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-width: 500px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="login-container">
                <h1 class="text-center mb-4">Customer Login</h1>

                <!-- Error message display -->
                <div th:if="${error}" class="alert alert-danger" role="alert">
                    <span th:text="${error}"></span>
                </div>

                <!-- FIXED: Added th:action for proper form submission -->
                <form th:action="@{/customer/login}" method="POST">
                    <div class="form-group">
                        <label for="email">Email Address *</label>
                        <input type="email" id="email" name="email" class="form-control"
                               placeholder="Enter your email address" required>
                        <small class="form-text text-muted">Enter the email you used to place your order</small>
                    </div>

                    <div class="form-group text-center">
                        <button type="submit" class="btn btn-primary btn-lg">View My Orders</button>
                    </div>
                </form>

                <div class="text-center mt-3">
                    <a th:href="@{/customer}" class="btn btn-secondary">Back to Home</a>
                    <a th:href="@{/customer/orders/new}" class="btn btn-success ml-2">Place New Order</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
