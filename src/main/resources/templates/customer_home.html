<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Customer Portal - Order Management System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .main-container {
            background: white;
            border-radius: 15px;
            padding: 40px;
            margin-top: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }
        .btn-custom {
            margin: 10px;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="main-container">
                <h1 class="text-center mb-4">Welcome to Our Pharmacy</h1>
                <p class="lead text-center mb-4">Manage your medicine orders easily</p>

                <div class="row mt-5">
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">Existing Customers</h5>
                                <p class="card-text">View and manage your existing orders</p>
                                <a th:href="@{/customer/login}" class="btn btn-primary btn-custom">
                                    View My Orders
                                </a>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">New Customers</h5>
                                <p class="card-text">Place a new medicine order</p>
                                <a th:href="@{/customer/orders/new}" class="btn btn-success btn-custom">
                                    Place New Order
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="mt-5">
                    <h4>Need Help?</h4>
                    <p>Contact us: support@pharmacy.com | +1 (555) 123-4567</p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
